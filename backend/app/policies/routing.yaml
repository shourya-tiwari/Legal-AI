# backend/app/policies/routing.yaml
#
# Declarative routing policy for the Model Router (docs/v2/AI_STACK.md).
# Versioned in git and eval-gated: a change here is a reviewed, tested change
# (tests/test_model_router.py + the eval gate).
#
# In the target monorepo this lives at packages/policies/routing.yaml.
#
# Provider names are resolved by app/services/model_router/registry.py:
#   local-llm            -> OpenAICompatProvider (LLM_BASE_URL: Ollama/vLLM/...)   Class B
#   local-embed-remote   -> OpenAICompatProvider embed role (EMBEDDING_BASE_URL:   Class B
#                           a TEI/Infinity container, /v1/embeddings)
#   local-embed-neural   -> SentenceTransformerProvider (optional -local extra)    Class B
#   local-embed-hash     -> HashingEmbeddingProvider (always available, offline)   Class A
#   local-rerank-remote  -> OpenAICompatProvider rerank role (RERANKER_BASE_URL:   Class B
#                           a TEI container, /rerank)
#   local-rerank-neural  -> SentenceTransformerProvider cross-encoder              Class B
#   local-rerank-lexical -> LexicalReranker (always available)                     Class A
#   local-llm-large      -> OpenAICompatProvider llm-large role (LLM_LARGE_MODEL)  Class B
#   local-nli            -> TransformersNLIProvider (DeBERTa/ModernBERT NLI head)  Class A
#   local-ner            -> GLiNERProvider (zero-shot NER; optional gliner extra)  Class B
#   gemini               -> GeminiProvider (providers-external; absent air-gapped) Class C
#
# Chain order for embed/rerank: dedicated GPU server first (the Phase 5/6
# self-hosted default), then the in-process neural model, then the always-on
# Class A approximation. Every leg fails soft, so an unconfigured / down
# server transparently degrades to the next.
#
# `chain`       = Class A/B candidates, tried in order by health.
# `escalate_to` = (generate only) a bigger SELF-HOSTED model, prepended to the
#                 chain when the caller passes hard=True. Never a Class C target
#                 (docs/v2/AI_STACK.md "Escalation without a bigger vendor").
# `class_c`     = external candidates, appended to the chain ONLY when
#                 EXTERNAL_PROVIDERS_ENABLED and STRICT_LOCAL_ONLY=false and the
#                 document's sensitivity tier is in class_c_allowed_tiers.
#                 A Class C provider is NEVER a silent fallback for a sensitive tier.

version: 2

class_c_allowed_tiers: [public, internal]

tasks:
  # ---- generation --------------------------------------------------------
  generic:                { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  clause_rewrite:         { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  timeline_extract:       { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  qa:                     { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  risk_analysis:          { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  contextualize:          { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  deontic_escalation:     { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  clause_type_escalation: { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  agent_summary:          { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }
  agent_plan:             { capability: generate, chain: [local-llm], escalate_to: [local-llm-large], class_c: [gemini] }

  # ---- embeddings ------------------------------------------------------
  embed_corpus: { capability: embed, chain: [local-embed-remote, local-embed-neural, local-embed-hash], class_c: [] }
  embed_query:  { capability: embed, chain: [local-embed-remote, local-embed-neural, local-embed-hash], class_c: [] }

  # ---- reranking ------------------------------------------------------
  rerank: { capability: rerank, chain: [local-rerank-remote, local-rerank-neural, local-rerank-lexical], class_c: [] }

  # ---- NLI faithfulness head (Verifier safety gate, Class A, local-only) ----
  verify_nli: { capability: entail, chain: [local-nli], class_c: [] }

  # ---- zero-shot NER --------------------------------------------------
  ner_extract: { capability: ner, chain: [local-ner], class_c: [] }
