name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11) — matches the npm that generated package-lock.json.
          # Node 20/22 ship npm 10, whose stricter `npm ci` sync check rejects
          # this lockfile ("Missing: @emnapi/* from lock file"). Node 20 is also
          # deprecated on GitHub runners.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Turbopack production build. api-types.ts is committed, so no
        # backend / codegen step is needed here.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
