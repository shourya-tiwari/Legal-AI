name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 = current LTS. (The lockfile was regenerated so `npm ci` also
          # passes on npm 10 / Node 20; 20 is just deprecated on the runners.)
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Turbopack production build. api-types.ts is committed, so no
        # backend / codegen step is needed here.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
