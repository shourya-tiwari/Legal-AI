name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # Core + the optional external-provider SDK, so the full suite
        # (including the provider-isolation contract and the Gemini adapter)
        # is exercised. The product itself runs on requirements.txt alone.
        run: pip install -r requirements-external.txt

      - name: Run tests
        env:
          GOOGLE_API_KEY: "ci-dummy-key"
        run: pytest -v

  core-only-smoke:
    # Proves the product imports and the Model Router resolves a working
    # provider chain with NO commercial-provider SDK installed
    # (the on-prem / air-gapped install).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core only
        run: pip install -r requirements.txt
      - name: Smoke test (no external / no local-neural providers installed)
        # The NLI/GLiNER model-gated tests (test_nli_faithfulness, test_ner_gliner)
        # self-skip here -- `transformers`/`gliner` come from requirements-local.txt,
        # which neither CI job installs.
        env:
          GOOGLE_API_KEY: ""
        run: pytest -v -k "provider_isolation or model_router or rag_hybrid or nlp_pipeline or eval_gate or eval_metrics or models_status"

  collapsed-data-layer-smoke:
    # The laptop/single-binary profile (docs/v2/ROADMAP.md Phase 7
    # "Collapsed data layer"): KG_BACKEND=kuzu substitutes an embedded,
    # in-process graph database for the Memgraph server, needing no
    # separate service at all. Unlike the Helm/OpenTofu/Zarf artifacts in
    # the sbom-and-image job, this one genuinely runs here -- kuzu is a
    # pure-Python-installable embedded database, no external service.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core + the collapsed data layer extra
        run: |
          pip install -r requirements.txt
          pip install -r requirements-collapsed.txt
      - name: Real end-to-end test against an actual embedded Kuzu database
        env:
          GOOGLE_API_KEY: ""
        run: pytest -v tests/test_kg_kuzu_client.py

  sbom-and-image:
    # Build-level proof that the on-prem/air-gapped image genuinely excludes
    # legalai-providers-external -- not just "no source file imports it"
    # (core-only-smoke, above) but "the SDK isn't even installed in the
    # image that ships" (docs/v2/ROADMAP.md Phase 7 "Build & supply chain",
    # docs/v2/ARCHITECTURE.md Security architecture item 2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the core (air-gapped) image
        run: docker build -t legalai-backend:core backend/

      - name: Build the external (Class C) image
        run: docker build -t legalai-backend:external --build-arg PROVIDER_PROFILE=external backend/

      - name: SBOM allowlist -- core image must be clean
        run: docker run --rm legalai-backend:core python scripts/check_sbom_allowlist.py

      - name: SBOM allowlist -- negative control (the check must actually have teeth)
        # Checking the *external* image against the *core* policy must FAIL
        # (it genuinely has google-genai installed) -- proves the allowlist
        # script isn't vacuously passing everything.
        run: |
          if docker run --rm legalai-backend:external python scripts/check_sbom_allowlist.py --profile core; then
            echo "FAIL: the allowlist check passed an image that has google-genai installed"
            exit 1
          fi

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: legalai-backend:core
          format: spdx-json
          output-file: legalai-backend-core.spdx.json

      - name: Scan for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: legalai-backend:core
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # report-only for now -- flip to "1" once a triage/allowlist process for findings exists

      - name: Sign the image (cosign, keyless/OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Signing needs a real registry to push the (already-built) image to
        # first -- this repo doesn't publish images anywhere yet, so this
        # step is wired but has nothing to sign against in this environment.
        # Left in place, gated to main, for the day a registry exists.
        run: echo "cosign signing needs a pushed image + registry -- not wired up yet, see docs/v2/TASKS.md"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: legalai-backend-core-sbom
          path: legalai-backend-core.spdx.json
