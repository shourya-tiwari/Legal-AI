apiVersion: apps/v1
kind: Deployment
metadata:
  name: legalai-backend
  labels:
    app: legalai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legalai-backend
  template:
    metadata:
      labels:
        app: legalai-backend
    spec:
      containers:
        - name: backend
          image: legalai-backend:core
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: legalai-backend-config
            - secretRef:
                name: legalai-backend-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
