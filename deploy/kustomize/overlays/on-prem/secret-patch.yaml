# Wires the backend at the in-cluster data-layer Service DNS names this
# overlay's data-layer.yaml creates. DATABASE_URL and POSTGRES_PASSWORD are
# deliberately left as empty placeholders here, not composed -- plain
# Kustomize has no string templating, so a connection string that embeds a
# password can't be built from two separate keys without either hardcoding
# a password in git (never) or a real templating layer (a Helm chart, or
# External Secrets Operator / Vault injecting the finished string directly).
# See deploy/helm/legalai's values.yaml for the templated equivalent.
apiVersion: v1
kind: Secret
metadata:
  name: legalai-backend-secrets
type: Opaque
stringData:
  REDIS_URL: "redis://legalai-redis:6379/0"
  MEMGRAPH_URI: "bolt://legalai-memgraph:7687"
