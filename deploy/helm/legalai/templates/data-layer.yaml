{{- if .Values.postgres.bundled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legalai-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legalai-postgres
  template:
    metadata:
      labels:
        app: legalai-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: legalai-backend-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: legalai-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: legalai-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: legalai-postgres
spec:
  selector:
    app: legalai-postgres
  ports:
    - port: 5432
{{- end }}
