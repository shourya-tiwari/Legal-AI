{{- $pgHost := "legalai-postgres" -}}
{{- $pgPort := 5432 -}}
{{- if .Values.postgres.external.enabled -}}
{{- $pgHost = .Values.postgres.external.host -}}
{{- $pgPort = .Values.postgres.external.port -}}
{{- end -}}
{{- $databaseUrl := printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.postgres.user .Values.postgres.password $pgHost $pgPort .Values.postgres.database -}}
{{- $redisUrl := "redis://legalai-redis:6379/0" -}}
{{- if .Values.redis.external.enabled -}}
{{- $redisUrl = .Values.redis.external.url -}}
{{- end -}}
{{- $memgraphUri := "bolt://legalai-memgraph:7687" -}}
{{- if .Values.memgraph.external.enabled -}}
{{- $memgraphUri = .Values.memgraph.external.uri -}}
{{- end -}}
{{- $llmBaseUrl := .Values.secrets.llmBaseUrl -}}
{{- $embeddingBaseUrl := .Values.secrets.embeddingBaseUrl -}}
{{- $rerankerBaseUrl := .Values.secrets.rerankerBaseUrl -}}
{{- if .Values.gpu.enabled -}}
{{- $llmBaseUrl = "http://legalai-ollama:11434/v1" -}}
{{- $embeddingBaseUrl = "http://legalai-tei-embed:80" -}}
{{- $rerankerBaseUrl = "http://legalai-tei-rerank:80" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: legalai-backend-secrets
  labels:
    {{- include "legalai.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  MEMGRAPH_URI: {{ $memgraphUri | quote }}
  MEMGRAPH_USER: ""
  MEMGRAPH_PASSWORD: ""
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  LLM_BASE_URL: {{ $llmBaseUrl | quote }}
  EMBEDDING_BASE_URL: {{ $embeddingBaseUrl | quote }}
  RERANKER_BASE_URL: {{ $rerankerBaseUrl | quote }}
